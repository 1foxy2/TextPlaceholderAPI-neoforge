## Loader Properties
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/1foxy2/TextPlaceholderAPI-neoforge"
logoFile="assets/icon.png" #optional
issueTrackerURL="https://github.com/1foxy2/TextPlaceholderAPI-neoforge/issues"
authors="${mod_authors}"
description='''${mod_description}'''

[modproperties.modmenu]
badges=["library"]
sources="https://github.com/1foxy2/TextPlaceholderAPI-neoforge" # a link to sources of the mod

[[dependencies.${mod_id}]]
    modId="forge"
    type="required"
    mandatory = true
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    mandatory = true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
